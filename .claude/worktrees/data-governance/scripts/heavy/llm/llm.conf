# Local LLM server config (laptop). Bound to 127.0.0.1 ONLY; reached from the PC through an SSH local-forward.
LLM_PORT=8081
LLM_THREADS=10          # leave 4 of 14 cores for heavy jobs
LLM_CTX=8192
LLM_SLOTS=2
LLM_MODEL_FILE=Qwen3-4B-Q4_K_M.gguf
LLM_MAX_RESTARTS=5      # per LLM_RESTART_WINDOW_S, then the supervisor stops and logs
LLM_RESTART_WINDOW_S=600
LLM_LOG_MAX_MB=20
